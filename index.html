<!doctype html>
<html lang="pt-BR">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Encantos Literários</title>
    <link rel="stylesheet" href="style/index.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Raleway:wght@100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="main-header">
      <nav class="nav-wrapper">
        <img src="assets/icons/logo-horizontal.svg" alt="" />
        <button>Assinar</button>
      </nav>
      <div class="header-content">
        <h1>Desperte a sua imaginação e explore novos mundos</h1>
        <p>
          Junte-se ao clube de assinatura Encantos Literários e descubra
          maravilhas e aventuras a cada página
        </p>
      </div>
    </header>

    <section class="hero">
      <div class="hero-features">
        <img
          src="assets/mystery-opened-spellbook.png"
          alt=""
          class="img-step-1"
        />
        <p class="animated-text">
          <span class="step-2"
            >Receba todo mês um
            <span class="highlight">livro surpresa</span></span
          >
          <span class="step-3"
            >do seu tema favorito, acompanhado de
            <span class="highlight">brindes exclusivos</span></span
          >
          <span class="step-4"
            >que tornarão a sua experiência literária
            <span class="highlight">encantadora</span></span
          >
        </p>
        <div class="feature-icons">
          <img
            src="assets/mystery-ouija-planchette.png"
            alt=""
            class="img-step-2"
          />
          <img
            src="assets/mystery-crystal-ball.png"
            alt=""
            class="img-step-4"
          />
        </div>
      </div>
    </section>
  </body>
</html>
